name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    name: Validar HTML (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node-version: [22, 24]
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verificar index.html na raiz
        run: bash scripts/ci/check-files.sh index

      - name: Bloquear arquivos acima de 500 KB
        run: bash scripts/ci/check-files.sh size

      - name: Varrer termos bloqueados
        run: bash scripts/ci/check-files.sh text

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Executar linter HTML
        run: npm run lint

      - name: Verificar links e imagens
        run: npm run check:links

      - name: Testar os bloqueios da CI
        run: npm test

  aprovacao:
    name: Validar HTML
    needs: qualidade
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Exigir sucesso nas duas versoes
        env:
          MATRIX_RESULT: ${{ needs.qualidade.result }}
        run: |
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "::error::A matriz precisa ser aprovada em cada versao do Node.js."
            exit 1
          fi
