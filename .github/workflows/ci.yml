name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    name: Validar HTML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verificar index.html na raiz
        run: bash scripts/ci/check-files.sh index

      - name: Bloquear arquivos acima de 500 KB
        run: bash scripts/ci/check-files.sh size

      - name: Varrer termos bloqueados
        run: bash scripts/ci/check-files.sh text

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Executar linter HTML
        run: npm run lint

      - name: Verificar links e imagens
        run: npm run check:links

      - name: Testar os bloqueios da CI
        run: npm test
